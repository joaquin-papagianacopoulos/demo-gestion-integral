<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión Integral · CRM + POS + Ecommerce (Demo)</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e4e8f0;--brand:#4f46e5;--brand2:#7c3aed;--brandbg:#eef2ff;--ok:#059669;--okbg:#d1fae5;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--side:#0f172a;--r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:#cbd5e1;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;font-weight:700;font-size:15px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff}
.brand small{display:block;font-weight:500;color:#94a3b8;font-size:11px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:10px;border:0;background:none;color:#cbd5e1;text-align:left;width:100%;position:relative}
.nav svg{width:19px;height:19px;stroke:currentColor;flex:none}
.nav:hover{background:#1e293b}
.nav.active{background:#312e81;color:#fff}
.nav .tag{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;background:#059669;color:#fff;letter-spacing:.03em}
.nav .tag.amber{background:#f59e0b;color:#1c1917}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #1e293b}
.sidefoot button{background:#1e293b;border:0;color:#cbd5e1;padding:9px 10px;border-radius:10px;text-align:left}
.sidefoot button:hover{background:#334155}
.content{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;flex:1}
.top h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.net{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;padding:6px 8px 6px 12px;border-radius:99px;font-weight:600}
.net svg{width:18px;height:18px}
.net.on{color:var(--ok);border-color:#a7f3d0;background:#ecfdf5}
.net.off{color:var(--bad);border-color:#fecaca;background:#fef2f2}
.sw{width:38px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.on .sw,.sw.on{background:var(--ok)}
.on .sw::after,.sw.on::after{left:19px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-weight:700}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);line-height:1.2}
.userbox b{display:block;color:var(--ink);font-size:13px}
.banner{background:#7f1d1d;color:#fff;padding:10px 24px;display:flex;align-items:center;gap:10px;font-weight:500}
.banner.sync{background:#065f46}
.banner svg{width:20px;height:20px;flex:none}
main{padding:22px 24px 90px;max-width:1500px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.mt{margin-top:16px}
.kpi{padding:16px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:750;margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:#4338ca}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border-color:#fecaca}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:14px 20px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap}
.chip.ok{background:var(--okbg);color:#065f46}.chip.warn{background:var(--warnbg);color:#92400e}.chip.bad{background:var(--badbg);color:#991b1b}.chip.brand{background:var(--brandbg);color:#3730a3}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbff}
.r{text-align:right}.c{text-align:center}
.neg{color:var(--bad)}.pos{color:var(--ok)}.mut{color:var(--mut)}
.scroll{overflow:auto}
input[type=text],input[type=number],input[type=date],select,.in{border:1px solid #d5dbe5;border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.fld input,.fld select{font-weight:400;color:var(--ink);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.hero{background:linear-gradient(120deg,#312e81,#6d28d9 60%,#a855f7);color:#fff;border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.hero h2{margin:0 0 8px;font-size:26px;line-height:1.2}
.hero p{margin:0;opacity:.9;max-width:560px}
.hero .pts{display:grid;gap:10px}
.hero .pt{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.hero .pt svg{width:22px;height:22px;stroke:#fff;flex:none}
.hero .btn{background:#fff;color:#312e81;border:0;margin-top:16px}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:.15s}
.mod:hover{transform:translateY(-2px);border-color:#c7d2fe}
.mod .n{width:30px;height:30px;border-radius:9px;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.mod b{display:block;margin-bottom:6px;font-size:15px}
.mod ul{margin:0;padding-left:18px;color:var(--mut);font-size:13px}
.hb{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbt{height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:99px}
.hb b{text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#64748b}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.posbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.scanbox{position:relative;flex:1;min-width:240px}
.scanbox input{width:100%;padding:13px 14px 13px 44px;font-size:16px;border:2px solid #c7d2fe;border-radius:12px;background:#fff}
.scanbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--brand)}
.scanbox.scanning input{border-color:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.15)}
.scanbox.scanning::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#ef4444;box-shadow:0 0 8px #ef4444;top:8px;animation:scan .45s ease-in-out}
@keyframes scan{from{top:6px}to{top:calc(100% - 8px)}}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-weight:600;color:var(--mut)}
.cats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:.12s}
.pcard:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--sh)}
.pcard:active{transform:scale(.97)}
.pcard .pemo{font-size:30px;line-height:1.1}
.pcard b{font-size:13px;line-height:1.25;min-height:32px}
.pcard .pprice{font-weight:800;font-size:16px}
.pcard .pstock{font-size:11.5px;color:var(--mut)}
.pcard .pstock.low{color:var(--warn);font-weight:700}
.pcard.out{opacity:.45;pointer-events:none}
.pcard .pb{position:absolute;top:8px;right:8px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:99px}
.cart{position:sticky;top:78px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);font-size:16px}
.cart .items{overflow:auto;flex:1;min-height:150px;margin:0 -6px;padding:0 6px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 0;border-bottom:1px dashed var(--line);font-size:16px}
.cline .nm{font-weight:700;font-size:17px;line-height:1.25}
.cline .sub{grid-column:1/3;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cline .tot{font-weight:800;font-size:19px;text-align:right}
.cline .ctl{grid-column:1/3;display:flex;gap:10px;align-items:center;margin-top:6px}
.cline select{padding:11px 10px;font-size:16px;font-weight:600;border:2px solid #94a3b8;border-radius:10px;height:48px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{border:2px solid var(--brand);background:#eef2ff;color:var(--brand);width:48px;height:48px;font-size:26px;font-weight:800;border-radius:12px;line-height:1}
.qty button:active{background:var(--brand);color:#fff}
.qty span{min-width:40px;text-align:center;font-weight:800;font-size:20px}
.rm{margin-left:auto;border:2px solid var(--bad);background:#fff;color:var(--bad);font-size:15px;font-weight:700;height:48px;padding:0 16px;border-radius:12px}
.rm:active{background:var(--bad);color:#fff}
.totals{border-top:2px solid var(--ink);padding-top:10px;margin-top:8px}
.totals .t{display:flex;justify-content:space-between;color:#334155;font-size:16px;margin:3px 0}
.totals .big{display:flex;justify-content:space-between;font-size:26px;font-weight:800;color:var(--ink);margin:6px 0 12px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.empty b{display:block;font-size:30px;margin-bottom:4px}
.paybtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.paybtns button{border:3px solid var(--c);background:var(--cl);color:var(--cd);border-radius:14px;padding:18px 8px;font-weight:800;font-size:18px;opacity:.85}
.paybtns button.on{background:var(--c);color:#fff;opacity:1;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:scale(1.03)}
.paybtns .m-efectivo{--c:#16a34a;--cl:#dcfce7;--cd:#14532d}
.paybtns .m-tarjeta{--c:#2563eb;--cl:#dbeafe;--cd:#1e3a8a}
.paybtns .m-qr{--c:#7c3aed;--cl:#ede9fe;--cd:#4c1d95}
.paybtns .m-cc{--c:#ea580c;--cl:#ffedd5;--cd:#7c2d12}
@media print{body *{visibility:hidden}.ticket,.ticket *{visibility:visible}.ticket{position:absolute;left:0;top:0;border:0;width:80mm;max-width:80mm}}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ticket{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#fffef8;border:1px dashed #cbd5e1;border-radius:8px;padding:14px;max-width:340px;margin:0 auto}
.ticket hr{border:0;border-top:1px dashed #94a3b8;margin:8px 0}
.ticket .l{display:flex;justify-content:space-between;gap:8px}
.tag-off{display:flex;gap:8px;align-items:center;border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:12px}
.tag-off.pend{background:var(--warnbg);color:#92400e}.tag-off.okk{background:var(--okbg);color:#065f46}
/* modal / toast */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:100;padding:16px;overflow:auto}
.modal-wrap[hidden]{display:none}
.modal{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(860px,100%)}
.modal h2{margin:0 0 14px;font-size:19px;display:flex;align-items:center}
.modal h2 .x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--mut)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/3}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:380px;animation:tin .25s}
.toast.ok{background:#065f46}.toast.warn{background:#92400e}.toast.bad{background:#991b1b}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.guidebtn{position:fixed;left:256px;bottom:18px;z-index:50;box-shadow:0 6px 18px rgba(79,70,229,.4)}
@media(max-width:860px){.guidebtn{left:80px}}
.sync-bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.sync-bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .4s}
.flow path.on{stroke:#10b981;stroke-dasharray:6 6;animation:dash 1s linear infinite}
.flow path.off{stroke:#ef4444;stroke-dasharray:3 7}
@keyframes dash{to{stroke-dashoffset:-24}}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.step p{margin:2px 0 6px;color:var(--mut)}
.browser{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.bbar{background:#eef1f6;padding:10px 14px;display:flex;gap:10px;align-items:center}
.bbar i{width:10px;height:10px;border-radius:50%;background:#cbd5e1}
.bbar .url{flex:1;background:#fff;border-radius:99px;padding:4px 14px;color:var(--mut);font-size:12.5px}
.shophead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff;font-weight:700}
.shopbody{padding:18px;display:grid;grid-template-columns:1fr 280px;gap:18px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.denom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.denom label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--mut)}
.denom input{width:100%}
.swrow{display:flex;align-items:center;gap:10px}
@media(max-width:1180px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}.g4,.g5{grid-template-columns:repeat(2,1fr)}.mods{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.g21,.g3{grid-template-columns:1fr}.shopbody{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:64px 1fr}.side{padding:12px 6px}.lbl,.brand span,.sidefoot span,.nav .tag{display:none}.top{padding:10px 14px}main{padding:16px 14px 90px}.g2{grid-template-columns:1fr}.userbox{display:none}.mods{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="content">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <main id="main"></main>
  </div>
</div>
<button class="btn p guidebtn" onclick="openGuide()" title="Guion de presentación">🎬 Guion de demo</button>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   GESTIÓN INTEGRAL · DEMO INTERACTIVA  (CRM + POS + Ecommerce)
   Archivo único, sin dependencias externas: funciona 100% sin internet.
   Todo lo que se ve son datos ficticios de ejemplo.
   ===================================================================== */
const BRAND='Gestión Integral';
const COMPANY='Distribuidora Demo S.A.';
const KEY='gi-demo-v3';

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const num=n=>Math.round(n).toLocaleString('es-AR');
const pad=(n,l=2)=>String(n).padStart(l,'0');
const fdate=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const ftime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fdt=t=>fdate(t)+' '+ftime(t);
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const DAY=864e5;
const round10=n=>Math.round(n/10)*10;
const sum=(a,f)=>a.reduce((x,y)=>x+(typeof f==='function'?f(y):y[f]),0);
const monthKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const CATS=['Bebidas','Almacén','Golosinas','Limpieza','Lácteos'];
const FD={u:0,d:.05,b:.10};              // descuento por formato (display 5%, bulto 10%)
const FNAME={u:'Unidad',d:'Display',b:'Bulto'};
const PAYN={efectivo:'Efectivo',tarjeta:'Tarjeta',qr:'QR / Transferencia',cc:'Cuenta corriente'};
const CHN={salon:'Salón (POS)',oficina:'Oficina',web:'Web'};
const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 pos:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h1M12 11h1M16 11h0M8 15h1M12 15h1M8 18h8"/>',

function promoFor(s,p){
  if(p.kind==='combo')return null;
  const m=s.promos.filter(x=>x.active&&(x.pid===p.id||(x.cat&&x.cat===p.cat)));
  return m.length?m.reduce((a,b)=>b.pct>a.pct?b:a):null;
}
function costOf(s,p){return p.kind==='combo'?p.comps.reduce((a,c)=>a+c.q*s.products.find(x=>x.id===c.pid).cost,0):p.cost}
function lineCalc(s,line,listId){
  const p=s.products.find(x=>x.id===line.pid);
  const fmt=p.kind==='combo'?'u':line.fmt;
  const units=fmt==='u'?line.qty:line.qty*(fmt==='d'?p.disp:p.bulto);
  const unit=round10(p.price*s.lists[listId].factor);
  const gross=unit*units, fdisc=gross*FD[fmt];
  const pr=promoFor(s,p), pdisc=(gross-fdisc)*(pr?pr.pct/100:0);
  return {p,fmt,units,unit,gross,fdisc,pdisc,promo:pr,total:Math.round(gross-fdisc-pdisc)};
}
function mkSale(s,o){
  const items=o.lines.map(l=>{const c=lineCalc(s,l,o.list);return{pid:l.pid,fmt:c.fmt,qty:l.qty,units:c.units,total:c.total,cost:Math.round(costOf(s,c.p)*c.units)}});
  return{id:'s'+(s.seq++),n:0,ts:o.ts,channel:o.channel,vendor:o.vendor,customerId:o.customerId,pay:o.pay,status:o.status,sync:'synced',items,total:sum(items,'total'),cost:sum(items,'cost')};
}

const P=id=>S.products.find(p=>p.id===id);

/* ---------- stock ---------- */
function consume(items){const m={};for(const it of items){const p=P(it.pid);if(p.kind==='combo')p.comps.forEach(c=>m[c.pid]=(m[c.pid]||0)+c.q*it.units);else m[it.pid]=(m[it.pid]||0)+it.units}return m}
function pendingMap(){return consume(pendingSales().flatMap(s=>s.items))}
function availBase(pid,loc='centro',pm){const p=P(pid);return p.stock[loc]-((pm||(loc==='centro'?pendingMap():{}))[pid]||0)}
function avail(p,loc='centro'){const pm=loc==='centro'?pendingMap():{};return p.kind==='combo'?Math.min(...p.comps.map(c=>Math.floor(availBase(c.pid,loc,pm)/c.q))):availBase(p.id,loc,pm)}
function applyStock(sale,loc){const m=consume(sale.items);for(const pid in m){const p=P(+pid);p.stock[loc]-=m[pid];if(p.stock[loc]<0)addLog(`Stock negativo en ${p.name} (${p.stock[loc]}). Revisar inventario.`,'warn')}}
function ccBal(kind,id){return sum(S.cc.filter(x=>x.kind===kind&&x.eid===id),x=>x.charge-x.pay)}
function addCC(kind,eid,charge,pay,concept){S.cc.push({ts:Date.now(),kind,eid,concept,charge,pay})}
function addTes(concept,amount){S.tes.push({ts:Date.now(),concept,amount})}
function addLog(msg,type='info'){S.log.unshift({ts:Date.now(),msg,type});S.log=S.log.slice(0,60)}
function applyServerEffects(sale){ // lo que ocurre en el servidor al recibir una venta
  if(sale.channel==='salon')applyStock(sale,'centro');
  if(sale.pay==='cc'&&sale.customerId)addCC('cliente',sale.customerId,sale.total,0,'Venta #'+sale.n);
}

/* ---------- conexión y sincronización ---------- */
function setOnline(v){
  if(S.online===v)return;
  S.online=v;
  if(v){addLog('Conexión restablecida','ok');toast('Conexión restablecida','ok');save();render();setTimeout(syncNow,900)}
  else{addLog('Conexión perdida: el POS pasa a modo offline','warn');toast('Sin conexión: el POS sigue vendiendo','warn');save();render()}
}
function toggleNet(){setOnline(!S.online)}
function syncNow(){
  if(!S.online||ui.syncing)return;
  if(!S.outbox.length){S.lastSync=Date.now();addLog('Sincronización de catálogo, precios y stock: sin cambios','info');save();render();toast('Todo sincronizado','ok');return}
  ui.syncing=true;ui.syncTotal=S.outbox.length;ui.syncIdx=0;
  addLog(`Iniciando sincronización de ${ui.syncTotal} venta(s) pendiente(s)…`,'info');render();
  const delay=ui.syncTotal>8?250:650;
  const step=()=>{
    if(!S.online){ui.syncing=false;addLog('Sincronización interrumpida. Se reanuda al reconectar.','warn');save();render();return}
    const id=S.outbox.shift();
    if(!id){ui.syncing=false;S.lastSync=Date.now();addLog('Catálogo, precios y stock actualizados con el servidor','ok');save();render();toast(`✓ ${ui.syncTotal} venta(s) sincronizada(s)`,'ok');return}
    const sale=S.sales.find(x=>x.id===id);
    if(sale){sale.sync='synced';applyServerEffects(sale);ui.syncIdx++;addLog(`Ticket #${sale.n} sincronizado (${money(sale.total)})`,'ok')}
    save();render();setTimeout(step,delay);
  };
  setTimeout(step,delay);
}
window.addEventListener('offline',()=>setOnline(false));
window.addEventListener('online',()=>setOnline(true));
function guard(){if(S.online)return true;toast('Sin conexión: esta función de gestión requiere internet. El POS sigue operando normalmente.','warn');return false}

function bars(vals,labels,color='#6366f1',h=160){
  const W=640,pl=6,max=Math.max(1,...vals),n=vals.length,bw=(W-pl*2)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h+26}">`;
  for(let i=0;i<4;i++){const y=h-(h*i/3);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#eef1f6"/>`}
  vals.forEach((v,i)=>{const bh=v/max*h,x=pl+i*bw+bw*.14;s+=`<rect x="${x}" y="${h-bh}" width="${bw*.72}" height="${bh}" rx="4" fill="${color}"><title>${labels[i]}: ${money(v)}</title></rect>`;
    if(n<=16||i%Math.ceil(n/12)===0)s+=`<text x="${x+bw*.36}" y="${h+16}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}

const TITLES={dash:['Panel general','Resumen del negocio en tiempo real'],pos:['Punto de venta','Salón de ventas · Sucursal Centro'],products:['Productos y stock','Catálogo, listas de precios y promociones'],sales:['Ventas y distribución','Pedidos, clientes y vendedores'],ecom:['Ecommerce','Tienda online integrada'],caja:['Cajas y tesorería','Apertura, arqueo, cierre y rendición'],admin:['Administración','Cuentas corrientes, gastos y sueldos'],reports:['Reportes y estadísticas','Ventas, rentabilidad, stock e impuestos'],sync:['Sincronización','Cola de pendientes y estado de la conexión']};
function renderChrome(){
  const pend=S.outbox.length;
  $('#side').innerHTML=`<div class="brand"><div class="logo">${ic('box')}</div><span>${BRAND}<small>CRM · POS · Ecommerce</small></span></div>`+
   NAV.map(([k,i,l,tag])=>`<button class="nav ${ui.page===k?'active':''}" onclick="go('${k}')">${ic(i)}<span class="lbl">${l}</span>${k==='sync'&&pend?`<span class="tag amber">${pend}</span>`:tag?`<span class="tag">${tag}</span>`:''}</button>`).join('')+
   `<div class="sidefoot"><button onclick="resetDemo()">↺ <span>Reiniciar demo</span></button></div>`;
  const [t,sub]=TITLES[ui.page];
  $('#top').innerHTML=`<h1>${t}<small>${sub}</small></h1>`+
   (pend?`<button class="chip warn" style="border:0;cursor:pointer" onclick="go('sync')">⏳ ${pend} venta${pend>1?'s':''} pendiente${pend>1?'s':''} de sincronizar</button>`:'')+
   `<button class="net ${S.online?'on':'off'}" onclick="toggleNet()" title="Simular corte de internet">${ic(S.online?'wifi':'wifioff')}${S.online?'En línea':'Sin conexión'}<span class="sw ${S.online?'on':''}"></span></button>`+
   `<div class="userbox"><div class="avatar">M</div><div><b>${esc(S.caja&&S.caja.cashier||'María Gómez')}</b>Sucursal Centro</div></div>`;
  $('#banner').innerHTML=ui.syncing?`<div class="banner sync">${ic('sync')}<span>Sincronizando ventas con el servidor… ${ui.syncIdx}/${ui.syncTotal}</span></div>`
   :!S.online?`<div class="banner">${ic('wifioff')}<span><b>Modo sin conexión.</b> El punto de venta sigue vendiendo: cada venta se guarda en este equipo y se sincroniza sola al volver internet.</span></div>`:'';
}
function render(){
  if(!S)return;
  renderChrome();
  $('#main').innerHTML=PAGES[ui.page]();
  if(ui.page==='pos'&&$('#modal').hidden){const i=$('#scan');if(i&&!ui.noFocus){i.focus();const l=i.value.length;try{i.setSelectionRange(l,l)}catch(e){}}}
}
function resetDemo(){if(!confirm('¿Reiniciar la demo con los datos originales?'))return;S=buildSeed();ui.cart=[];ui.webCart=[];ui.syncing=false;save();render();toast('Demo reiniciada','ok')}

/* =====================================================================
   PÁGINAS
   ===================================================================== */
const PAGES={dash:pgDash,pos:pgPos,products:pgProducts,sales:pgSales,ecom:pgEcom,caja:pgCaja,admin:pgAdmin,reports:pgReports,sync:pgSync};

/* ---------- 0. INICIO ---------- */
function pgDash(){
  const now=Date.now(),t0=startOfDay(now),ss=srvSales();
  const today=ss.filter(x=>x.ts>=t0),yest=ss.filter(x=>x.ts>=t0-DAY&&x.ts<t0);
  const tot=sum(today,'total'),ytot=sum(yest,'total'),delta=ytot?Math.round((tot/ytot-1)*100):0;
  const pend=S.sales.filter(x=>x.channel!=='salon'&&(x.status==='Pendiente'||x.status==='Preparado'));
  const low=S.products.filter(p=>p.kind==='prod'&&p.stock.centro<p.min);
  const d14=[],l14=[];for(let i=13;i>=0;i--){const a=t0-i*DAY;d14.push(sum(ss.filter(x=>x.ts>=a&&x.ts<a+DAY),'total'));l14.push(fdate(a))}
  const ch={salon:0,oficina:0,web:0};ss.filter(x=>x.ts>=t0-29*DAY).forEach(x=>ch[x.channel]+=x.total);const mx=Math.max(...Object.values(ch));
  const tp={};ss.filter(x=>x.ts>=t0-29*DAY).forEach(x=>x.items.forEach(i=>{tp[i.pid]=(tp[i.pid]||0)+i.total}));
  const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);const tmx=top.length?top[0][1]:1;
  const cajaCash=S.caja.open?cashExpected(S.caja):0;
  const mods=[['products','1','Gestión de productos y stock',['Stock por sucursal y depósito','Listas de precios y promociones','Venta por unidad, display y bulto']],['pos','2','Salón de ventas y POS',['Autoservicio con carrito','Escaneo por código de barras','⚡ Funciona sin internet']],['sales','3','Ventas y distribución',['Pedidos de oficina','Clientes y vendedores','Listas diferenciadas']],['caja','4','Cajas y tesorería',['Apertura, arqueo y cierre','Rendición a tesorería','Ingresos y egresos']],['admin','5','Administración',['Cuentas corrientes','Cobranzas y pagos','Gastos y sueldos']],['reports','6','Reportes y estadísticas',['Ventas, stock y rentabilidad','Exportación a Excel','IVA, IIBB y control de cajas']]];
  return `<div class="hero"><div><h2>Todo el negocio en una sola plataforma</h2><p>Productos, stock, salón de ventas, pedidos, ecommerce, cajas y administración conectados entre sí. Un dato se carga una vez y se ve en todos lados.</p><button class="btn" onclick="go('pos')">Ver el punto de venta →</button></div>
   <div class="pts"><div class="pt">${ic('wifioff')}<span>El POS vende sin internet y sincroniza solo</span></div><div class="pt">${ic('globe')}<span>Tienda online con stock y precios en vivo</span></div><div class="pt">${ic('chart')}<span>Reportes listos para contabilidad</span></div></div></div>
  <div class="grid g5 mt">${kpi('Ventas de hoy',money(tot),(delta>=0?'▲ ':'▼ ')+Math.abs(delta)+'% vs. ayer completo',delta>=0?'ok':'')}${kpi('Tickets y pedidos',today.length,'Salón, oficina y web')}${kpi('Efectivo en caja',S.caja.open?money(cajaCash):'Cerrada',S.caja.open?'Caja #'+S.caja.id+' abierta':'Abrí la caja para vender',S.caja.open?'':'warn')}${kpi('Pedidos por entregar',pend.length,'Pendientes y preparados',pend.length?'warn':'')}${kpi('Stock crítico',low.length,'Productos bajo mínimo en salón',low.length?'bad':'')}</div>
  ${S.outbox.length?`<div class="card mt" style="border-color:#fcd34d;background:#fffbeb"><b>⏳ ${S.outbox.length} venta(s) del salón todavía no llegaron al servidor.</b> Este panel solo muestra datos sincronizados: aparecerán en cuanto vuelva la conexión. <button class="btn sm" onclick="go('sync')">Ver cola</button></div>`:''}
  <div class="grid g21 mt"><div class="card"><h3>Ventas de los últimos 14 días</h3>${bars(d14,l14)}</div>
   <div class="card"><h3>Ventas por canal (30 días)</h3>${hb('Salón (POS)',ch.salon,mx,money(ch.salon),'#6366f1')}${hb('Oficina',ch.oficina,mx,money(ch.oficina),'#0ea5e9')}${hb('Web',ch.web,mx,money(ch.web),'#10b981')}<h3 style="margin-top:18px">Top productos</h3>${top.map(([id,v])=>hb(esc(P(+id).name.slice(0,18)),v,tmx,money(v),'#a855f7')).join('')}</div></div>
  <div class="grid g2 mt"><div class="card"><h3>⚠️ Stock crítico en salón</h3>${low.length?table(['Producto','>Stock','>Mínimo'],low.map(p=>`<tr><td>${p.emoji} ${esc(p.name)}</td><td class="r neg"><b>${p.stock.centro}</b></td><td class="r">${p.min}</td></tr>`).join('')):'<div class="empty">Todo en orden ✔</div>'}</div>
   <div class="card"><h3>Pedidos por entregar</h3>${table(['Origen','Cliente','>Total','Estado'],pend.slice(-6).reverse().map(x=>`<tr><td><span class="chip ${x.channel==='web'?'ok':'brand'}">${CHN[x.channel]}</span></td><td>${esc(CU(x.customerId).name)}</td><td class="r">${money(x.total)}</td><td>${stChip(x.status)}</td></tr>`).join(''))}</div></div>
  <h3 style="margin:26px 0 12px;font-size:16px">Módulos de la solución</h3><div class="mods">${mods.map(m=>`<button class="mod" onclick="go('${m[0]}')"><div class="n">${m[1]}</div><b>${m[2]}</b><ul>${m[3].map(x=>`<li>${x}</li>`).join('')}</ul></button>`).join('')}</div>`;
}
const stChip=s=>`<span class="chip ${s==='Entregado'?'ok':s==='Preparado'?'brand':s==='Cancelado'?'bad':'warn'}">${s}</span>`;

/* ---------- 1. POS ---------- */
function cartLines(){return ui.cart.map(l=>({l,c:LC(l,'salon')}))}
function cartTotals(){const cl=cartLines();return{gross:sum(cl,x=>x.c.gross),disc:sum(cl,x=>x.c.fdisc+x.c.pdisc),total:sum(cl,x=>x.c.total),n:sum(ui.cart,'qty')}}
function cartShort(){const m=consume(cartLines().map(x=>({pid:x.l.pid,units:x.c.units}))),pm=pendingMap();for(const pid in m){if(m[pid]>availBase(+pid,'centro',pm))return P(+pid).name}return null}
function pgPos(){
  if(!S.caja.open)return `<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><div style="font-size:44px">🔒</div><h3 style="justify-content:center;font-size:20px">La caja está cerrada</h3><p class="mut">Para empezar a vender hay que abrir la caja con el efectivo inicial.</p><button class="btn p lg" onclick="openCajaModal()">Abrir caja</button></div>`;
  const sc=['Escanear: Cola','Escanear: Fideos','Escanear: Alfajor'],codes=[1,5,11];
  return `<div class="pos"><div>
   <div class="posbar"><div class="scanbox" id="scanbox">${ic('scan')}<input id="scan" type="text" autocomplete="off" placeholder="Escaneá el código de barras o buscá un producto…" value="${esc(ui.posSearch)}" oninput="posType(this.value)" onkeydown="if(event.key==='Enter')posEnter()"></div>
    <button class="btn" onclick="scanRandom()">${ic('scan')} Simular escaneo</button>
    <span class="chip ${S.online?'ok':'bad'}">${S.online?'● En línea':'● Offline'}</span>
    <span class="chip brand">Caja #${S.caja.id} · ${esc(S.caja.cashier)}</span>
    ${S.outbox.length?`<button class="chip warn" style="border:0;cursor:pointer" onclick="go('sync')">⏳ ${S.outbox.length} pendiente(s)</button>`:''}</div>
   <div class="row mut" style="margin:-4px 0 12px;font-size:12.5px">Códigos de prueba: ${codes.map((c,i)=>`<button class="chip brand" style="border:0;cursor:pointer" onclick="scanCode('${P(c).code}')">${sc[i]}</button>`).join('')}<span>o tipeá cualquier código de 13 dígitos + Enter</span></div>
   <div class="cats">${['Todos',...CATS,'Combos'].map(c=>`<button class="${ui.posCat===c?'on':''}" onclick="ui.posCat='${c}';render()">${c}</button>`).join('')}</div>
   <div class="pgrid" id="posGrid">${posGridHtml()}</div></div>
   <div class="card cart" id="cartPanel">${cartHtml()}</div></div>`;
}
function posGridHtml(){
  const q=ui.posSearch.trim().toLowerCase();
  const list=S.products.filter(p=>(ui.posCat==='Todos'||p.cat===ui.posCat)&&(!q||p.name.toLowerCase().includes(q)||p.code.includes(q)));
  return list.map(p=>{const a=avail(p),u=round10(p.price*S.lists.salon.factor),pr=promoFor(S,p);
    return `<button class="pcard ${a<=0?'out':''}" onclick="addItem(${p.id})">${pr?`<span class="pb">-${pr.pct}%</span>`:p.kind==='combo'?`<span class="pb" style="background:#7c3aed">COMBO</span>`:''}<span class="pemo">${p.emoji}</span><b>${esc(p.name)}</b><span class="pprice">${money(pr?u*(1-pr.pct/100):u)}</span><span class="pstock ${a<=p.min&&p.kind==='prod'?'low':''}">${a<=0?'Sin stock':'Stock: '+a}</span></button>`}).join('')||'<div class="empty">No se encontraron productos</div>';
}
function cartHtml(){
  const cl=cartLines(),t=cartTotals();
  return `<h3>🛒 Carrito <span class="chip sp">${t.n} ítem${t.n===1?'':'s'}</span></h3><div class="items">`+
  (cl.length?cl.map(({l,c},i)=>`<div class="cline"><span class="nm">${c.p.emoji} ${esc(c.p.name)}</span><span class="tot">${money(c.total)}</span>
    <span class="sub">${money(c.unit)} c/u${c.fdisc?` · <span class="pos">-${FD[c.fmt]*100}% ${FNAME[c.fmt].toLowerCase()}</span>`:''}${c.promo?` · <span class="pos">-${c.promo.pct}% promo</span>`:''}${c.fmt!=='u'?` · ${c.units} un.`:''}</span>
    <div class="ctl"><span class="qty"><button onclick="qtyItem(${i},-1)">−</button><span>${l.qty}</span><button onclick="qtyItem(${i},1)">+</button></span>
    ${c.p.kind==='combo'?'':`<select onchange="fmtItem(${i},this.value)"><option value="u" ${l.fmt==='u'?'selected':''}>Unidad</option><option value="d" ${l.fmt==='d'?'selected':''}>Display x${c.p.disp}</option><option value="b" ${l.fmt==='b'?'selected':''}>Bulto x${c.p.bulto}</option></select>`}
    <button class="rm" onclick="delItem(${i})">Quitar</button></div></div>`).join(''):`<div class="empty"><b>🛒</b>El carrito está vacío.<br>Escaneá un producto o tocá una tarjeta.</div>`)+
  `</div><div class="totals"><div class="t"><span>Subtotal</span><span>${money(t.gross)}</span></div><div class="t"><span>Descuentos</span><span class="pos">-${money(t.disc)}</span></div><div class="big"><span>Total</span><span>${money(t.total)}</span></div>
   <div class="row"><button class="btn p lg" style="flex:1;justify-content:center" ${cl.length?'':'disabled'} onclick="openCheckout()">Cobrar (F2)</button><button class="btn lg" ${cl.length?'':'disabled'} onclick="ui.cart=[];render()">Vaciar</button></div></div>`;
}
function posType(v){ui.posSearch=v;$('#posGrid').innerHTML=posGridHtml()}
function posEnter(){
  const v=ui.posSearch.trim();if(!v)return;
  let p=S.products.find(x=>x.code===v);
  if(!p){const m=S.products.filter(x=>x.name.toLowerCase().includes(v.toLowerCase()));if(m.length===1)p=m[0]}
  if(!p){toast('Código o producto no encontrado','bad');beep(false);return}
  ui.posSearch='';scanFx();addItem(p.id);
}
function scanCode(code){const p=S.products.find(x=>x.code===code);if(p){scanFx();addItem(p.id)}}
function scanRandom(){const l=S.products.filter(p=>p.kind==='prod'&&avail(p)>0);scanFx();addItem(l[Math.floor(Math.random()*l.length)].id)}
function scanFx(){const b=$('#scanbox');if(b){b.classList.add('scanning');setTimeout(()=>b.classList.remove('scanning'),450)}}
function addItem(pid,fmt='u',qty=1){
  if(!S.caja.open){toast('Abrí la caja para vender','warn');return}
  let l=ui.cart.find(x=>x.pid===pid&&x.fmt===fmt);
  if(l)l.qty+=qty;else{l={pid,fmt,qty};ui.cart.push(l)}
  const bad=cartShort();
  if(bad){l.qty-=qty;if(l.qty<=0)ui.cart.splice(ui.cart.indexOf(l),1);toast('Sin stock suficiente de '+bad,'warn');beep(false);render();return}
  beep(true);render();
}
function qtyItem(i,d){const l=ui.cart[i];l.qty+=d;if(l.qty<=0){ui.cart.splice(i,1)}else if(cartShort()){l.qty-=d;toast('Sin stock suficiente','warn')}render()}
function fmtItem(i,f){const l=ui.cart[i],old=l.fmt;l.fmt=f;const ex=ui.cart.find((x,k)=>k!==i&&x.pid===l.pid&&x.fmt===f);if(ex){ex.qty+=l.qty;ui.cart.splice(i,1)}if(cartShort()){if(ex){ex.qty-=l.qty;ui.cart.splice(i,0,l)}l.fmt=old;toast('Sin stock suficiente para ese formato','warn')}render()}
function delItem(i){ui.cart.splice(i,1);render()}

function openCheckout(){
  if(!ui.cart.length)return;
  const dc=S.customers.find(c=>c.list==='dist');
  ui.pay={m:'efectivo',tend:'',cust:dc.id};modal(checkoutHtml());
  setTimeout(()=>{const i=$('#tend');if(i)i.focus()},50);
}
function checkoutHtml(){
  const t=cartTotals(),p=ui.pay;
  const q=[t.total,Math.ceil(t.total/1000)*1000,Math.ceil(t.total/5000)*5000,Math.ceil(t.total/10000)*10000,20000,50000].filter((v,i,a)=>v>=t.total&&a.indexOf(v)===i).slice(0,4);
  return `<h2>Cobrar <span class="x" onclick="closeModal()" style="cursor:pointer">×</span></h2>
   ${S.online?'':`<div class="tag-off pend">⚠ Sin conexión: la venta se guardará en este equipo y se sincronizará al reconectar.</div>`}
   <div style="text-align:center;font-size:38px;font-weight:800">${money(t.total)}</div>
   <div class="paybtns">${[['efectivo','💵 Efectivo'],['tarjeta','💳 Tarjeta'],['qr','📱 QR / Transferencia'],['cc','📒 Cuenta corriente']].map(([k,l])=>`<button class="m-${k} ${p.m===k?'on':''}" onclick="ui.pay.m='${k}';setModalBody(checkoutHtml())">${l}</button>`).join('')}</div>
   ${p.m==='efectivo'?`<div class="fld">Recibido</div><div class="quick">${q.map(v=>`<button class="btn sm" onclick="document.getElementById('tend').value=${v};calcChange()">${v===t.total?'Exacto':money(v)}</button>`).join('')}</div><input id="tend" type="number" class="in" style="width:100%;font-size:18px" placeholder="Monto recibido" value="${esc(p.tend)}" oninput="calcChange()"><div id="change" class="row sb" style="font-size:18px;margin-top:10px"><span>Vuelto</span><b>—</b></div>`:''}
   ${p.m==='cc'?`<label class="fld">Cliente<select onchange="ui.pay.cust=+this.value;setModalBody(checkoutHtml())">${S.customers.filter(c=>c.list==='dist').map(c=>`<option value="${c.id}" ${p.cust===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><p class="mut">Saldo actual: <b>${money(ccBal('cliente',p.cust))}</b> · Límite ${money(CU(p.cust).limit)}</p>`:''}
   <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn ok lg" onclick="confirmSale()">Confirmar venta</button></div>`;
}
function calcChange(){const t=cartTotals().total,v=+$('#tend').value||0;ui.pay.tend=$('#tend').value;$('#change').innerHTML=`<span>Vuelto</span><b class="${v>=t?'pos':'neg'}">${v>=t?money(v-t):'Falta '+money(t-v)}</b>`}
function confirmSale(){
  const t=cartTotals(),p=ui.pay;let tend=+p.tend||0;
  if(p.m==='efectivo'){if(!tend)tend=t.total;if(tend<t.total){toast('El monto recibido no alcanza','warn');return}}
  const cust=p.m==='cc'?p.cust:0;
  const sale=mkSale(S,{ts:Date.now(),channel:'salon',vendor:'Salón',customerId:cust,pay:p.m,status:'Entregado',lines:ui.cart,list:'salon'});
  sale.n=S.nextTicket++;sale.tendered=tend;
  const off=!S.online;sale.sync=off?'pending':'synced';if(off)sale.offline=true;
  S.sales.push(sale);
  S.caja.movs.push({ts:sale.ts,type:'venta',method:p.m,amount:sale.total,concept:'Venta #'+sale.n,saleId:sale.id});
  if(off){S.outbox.push(sale.id);addLog(`Ticket #${sale.n} guardado localmente (${money(sale.total)}) · pendiente de sync`,'warn')}else applyServerEffects(sale);
  ui.cart=[];save();beep(true);showTicket(sale);
}
function showTicket(sale){
  const lines=sale.items.map(it=>{const p=P(it.pid);return `<div class="l"><span>${it.qty}${it.fmt!=='u'?' '+FNAME[it.fmt].toLowerCase():''} ${esc(p.name.slice(0,22))}</span><span>${money(it.total)}</span></div>`}).join('');
  modal(`<div class="tag-off ${sale.sync==='pending'?'pend':'okk'}">${sale.sync==='pending'?'⏳ Venta guardada en el dispositivo. Se sincroniza automáticamente al reconectar.':'✔ Venta registrada y sincronizada.'}</div>
   <div class="ticket"><div style="text-align:center"><b>${COMPANY}</b><br>Sucursal Centro<br>${fdt(sale.ts)}<br>Ticket #${sale.n}</div><hr>${lines}<hr><div class="l"><b>TOTAL</b><b>${money(sale.total)}</b></div><div class="l"><span>Pago</span><span>${PAYN[sale.pay]}</span></div>${sale.pay==='efectivo'&&sale.tendered>sale.total?`<div class="l"><span>Vuelto</span><span>${money(sale.tendered-sale.total)}</span></div>`:''}<hr><div style="text-align:center">¡Gracias por su compra!</div></div>
   <div class="actions" style="justify-content:center"><button class="btn lg" onclick="window.print()">🖨 Imprimir ticket</button><button class="btn p lg" onclick="closeModal()">Nueva venta</button></div>`);
}

function pgProducts(){
  const t=tab('products','list');
  return tabs('products',[['list','Productos y stock'],['prices','Listas de precios'],['promos','Promociones y combos']],'list')+(t==='list'?prodList():t==='prices'?prodPrices():prodPromos());
}
function prodList(){
  const q=ui.prodSearch.toLowerCase();
  const l=S.products.filter(p=>p.kind==='prod'&&(ui.prodCat==='Todos'||p.cat===ui.prodCat)&&(!q||p.name.toLowerCase().includes(q)||p.code.includes(q)));
  return `<div class="card"><div class="row sb" style="margin-bottom:12px"><div class="row"><input type="text" id="psearch" class="in" placeholder="Buscar nombre o código…" value="${esc(ui.prodSearch)}" oninput="ui.prodSearch=this.value;$('#prodRows').innerHTML=prodRows()" style="width:260px"><select onchange="ui.prodCat=this.value;render()">${['Todos',...CATS].map(c=>`<option ${ui.prodCat===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn p" onclick="prodModal()">${ic('plus')} Nuevo producto</button></div>
  ${table(['Producto','Código','Categoría','>Costo','>Precio','>Margen','>Salón','>Depósito','Formatos',''],`<tbody id="prodRows" style="display:contents">${prodRows()}</tbody>`)}</div>`;

function prodRows(){
  const q=ui.prodSearch.toLowerCase();
  return S.products.filter(p=>p.kind==='prod'&&(ui.prodCat==='Todos'||p.cat===ui.prodCat)&&(!q||p.name.toLowerCase().includes(q)||p.code.includes(q))).map(p=>`<tr><td>${p.emoji} <b>${esc(p.name)}</b></td><td class="mut">${p.code}</td><td>${p.cat}</td><td class="r">${money(p.cost)}</td><td class="r"><b>${money(p.price)}</b></td><td class="r pos">${Math.round((p.price/p.cost-1)*100)}%</td><td class="r ${p.stock.centro<p.min?'neg':''}"><b>${p.stock.centro}</b></td><td class="r">${p.stock.deposito}</td><td class="mut">Display x${p.disp} · Bulto x${p.bulto}</td><td class="r" style="white-space:nowrap"><button class="btn sm" onclick="prodModal(${p.id})">Editar</button> <button class="btn sm" onclick="transferModal(${p.id})">Transferir</button> <button class="btn sm bad" onclick="prodDel(${p.id})">Baja</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">Sin resultados</td></tr>';
}
function prodModal(id){

  modal(`<h2>${id?'Editar':'Nuevo'} producto <button class="x" onclick="closeModal()">×</button></h2><div class="form">
   <label class="fld full">Nombre<input type="text" id="f_name" value="${esc(p.name)}"></label>
   <label class="fld">Categoría<select id="f_cat">${CATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fld">Código de barras<input type="text" id="f_code" value="${p.code}"></label>
   <label class="fld">Costo<input type="number" id="f_cost" value="${p.cost}"></label><label class="fld">Precio de venta (lista salón)<input type="number" id="f_price" value="${p.price}"></label>
   <label class="fld">Unidades por display<input type="number" id="f_disp" value="${p.disp}"></label><label class="fld">Unidades por bulto<input type="number" id="f_bulto" value="${p.bulto}"></label>
   <label class="fld">Stock salón<input type="number" id="f_sc" value="${p.stock.centro}"></label><label class="fld">Stock depósito<input type="number" id="f_sd" value="${p.stock.deposito}"></label>
   <label class="fld">Stock mínimo<input type="number" id="f_min" value="${p.min}"></label></div>
   <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="prodSave(${id||0})">Guardar</button></div>`);

function prodSave(id){
  const g=k=>$('#f_'+k).value,n=k=>+g(k)||0;
  if(!g('name').trim()){toast('Ingresá un nombre','warn');return}
  const d={name:g('name').trim(),cat:g('cat'),code:g('code'),cost:n('cost'),price:n('price'),disp:n('disp')||1,bulto:n('bulto')||1,stock:{centro:n('sc'),deposito:n('sd')},min:n('min')};
  if(id)Object.assign(P(id),d);else S.products.push({id:S.seq++,kind:'prod',emoji:'📦',...d});
  addLog(`Producto ${id?'actualizado':'creado'}: ${d.name}`,'info');save();closeModal();toast('Producto guardado','ok');
}
function prodDel(id){if(!guard())return;const p=P(id);if(!confirm(`¿Dar de baja "${p.name}"?`))return;S.products=S.products.filter(x=>x.id!==id);S.products.forEach(c=>{if(c.kind==='combo')c.comps=c.comps.filter(k=>k.pid!==id)});S.products=S.products.filter(x=>x.kind!=='combo'||x.comps.length);save();render();toast('Producto dado de baja','ok')}
function transferModal(id){
  if(!guard())return;const p=P(id);
  modal(`<h2>Transferir stock <button class="x" onclick="closeModal()">×</button></h2><p><b>${p.emoji} ${esc(p.name)}</b><br><span class="mut">Salón: ${p.stock.centro} · Depósito: ${p.stock.deposito}</span></p><div class="form"><label class="fld">Dirección<select id="t_dir"><option value="dc">Depósito → Salón</option><option value="cd">Salón → Depósito</option></select></label><label class="fld">Cantidad (unidades)<input type="number" id="t_q" value="24"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="transferDo(${id})">Transferir</button></div>`);
}
function transferDo(id){const p=P(id),q=+$('#t_q').value||0,from=$('#t_dir').value==='dc'?'deposito':'centro',to=from==='deposito'?'centro':'deposito';if(q<=0||q>p.stock[from]){toast('Cantidad inválida o sin stock de origen','warn');return}p.stock[from]-=q;p.stock[to]+=q;addLog(`Transferencia: ${q} × ${p.name} (${from} → ${to})`,'info');save();closeModal();toast('Transferencia realizada','ok')}
function prodPrices(){
  const sample=S.products.filter(p=>p.kind==='prod').slice(0,8);
  return `<div class="grid g3">${Object.entries(S.lists).map(([k,L])=>`<div class="card"><h3>${L.name}</h3><div style="font-size:28px;font-weight:800">${L.factor===1?'Precio base':(L.factor<1?'-':'+')+Math.abs(Math.round((1-L.factor)*1000)/10)+'%'}</div><p class="mut">${k==='salon'?'Se usa en el POS del salón':k==='dist'?'Se usa en pedidos de oficina y vendedores':'Se usa en la tienda online'}</p>${k==='salon'?'':`<div class="row"><label class="fld">Ajustar % sobre precio base<input type="number" step="0.5" value="${Math.round((L.factor-1)*1000)/10}" onchange="listSet('${k}',this.value)"></label></div>`}</div>`).join('')}</div>
  <div class="card mt"><h3>Comparativa de precios por lista</h3>${table(['Producto','>Costo','>Salón','>Distribución','>Ecommerce','>Margen distrib.'],sample.map(p=>{const u=k=>round10(p.price*S.lists[k].factor);return `<tr><td>${p.emoji} ${esc(p.name)}</td><td class="r mut">${money(p.cost)}</td><td class="r">${money(u('salon'))}</td><td class="r">${money(u('dist'))}</td><td class="r">${money(u('ecom'))}</td><td class="r pos">${Math.round((u('dist')/p.cost-1)*100)}%</td></tr>`}).join(''))}</div>
  <div class="card mt"><h3>Actualización masiva de precios</h3><div class="row"><label class="fld">Categoría<select id="mp_cat"><option>Todas</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="fld">Porcentaje (%)<input type="number" id="mp_pct" value="5" step="0.5"></label><button class="btn p" style="align-self:flex-end" onclick="massPrice()">Aplicar actualización</button></div><p class="mut">Impacta al instante en salón, distribución y ecommerce (el POS la recibe en la próxima sincronización).</p></div>`;
}
function listSet(k,v){if(!guard()){render();return}S.lists[k].factor=1+(+v||0)/100;addLog(`Lista "${S.lists[k].name}" ajustada a ${v}%`,'info');save();render();toast('Lista de precios actualizada','ok')}
function massPrice(){if(!guard())return;const c=$('#mp_cat').value,pc=+$('#mp_pct').value||0;let n=0;S.products.forEach(p=>{if(p.kind==='prod'&&(c==='Todas'||p.cat===c)){p.price=round10(p.price*(1+pc/100));n++}});addLog(`Actualización masiva ${pc}% (${c}): ${n} productos`,'info');save();render();toast(`${n} precios actualizados (${pc}%)`,'ok')}
function prodPromos(){
  const combos=S.products.filter(p=>p.kind==='combo');
  return `<div class="grid g2"><div class="card"><h3>Promociones y descuentos <button class="btn sm p sp" onclick="promoModal()">${ic('plus')} Nueva</button></h3>${table(['Promoción','Aplica a','>Dto.','Activa'],S.promos.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mut">${x.pid?esc(P(x.pid)?P(x.pid).name:'—'):x.cat}</td><td class="r">${x.pct}%</td><td><span class="sw ${x.active?'on':''}" style="cursor:pointer;display:inline-block" onclick="promoToggle(${x.id})"></span></td></tr>`).join(''))}
   <p class="mut" style="margin:10px 0 0">Además: <b>display -5%</b> y <b>bulto -10%</b> automáticos en toda la venta mayorista.</p></div>
  <div class="card"><h3>Combos <button class="btn sm p sp" onclick="comboModal()">${ic('plus')} Nuevo</button></h3>${table(['Combo','Incluye','>Suelto','>Combo','>Stock'],combos.map(c=>{const sl=c.comps.reduce((a,k)=>a+P(k.pid).price*k.q,0);return `<tr><td>${c.emoji} <b>${esc(c.name)}</b></td><td class="mut" style="font-size:12px">${c.comps.map(k=>k.q+'× '+esc(P(k.pid).name)).join(', ')}</td><td class="r mut"><s>${money(sl)}</s></td><td class="r"><b>${money(c.price)}</b></td><td class="r">${avail(c)}</td></tr>`}).join(''))}</div></div>`;
}
function promoToggle(id){if(!guard())return;const x=S.promos.find(p=>p.id===id);x.active=!x.active;addLog(`Promoción "${x.name}" ${x.active?'activada':'desactivada'}`,'info');save();render()}
function promoModal(){if(!guard())return;modal(`<h2>Nueva promoción <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld full">Nombre<input type="text" id="pr_n" value="Promo de temporada"></label><label class="fld">Categoría<select id="pr_c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="fld">% de descuento<input type="number" id="pr_p" value="10"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="promoSave()">Crear</button></div>`)}
function promoSave(){S.promos.push({id:S.seq++,name:$('#pr_n').value||'Promo',cat:$('#pr_c').value,pct:+$('#pr_p').value||0,active:true});save();closeModal();toast('Promoción creada y activa','ok')}
function comboModal(){if(!guard())return;const opts=(sel)=>S.products.filter(p=>p.kind==='prod').map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
  modal(`<h2>Nuevo combo <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld">Nombre<input type="text" id="cb_n" value="Combo Nuevo"></label><label class="fld">Precio del combo<input type="number" id="cb_p" value="5000"></label>${[1,2,3].map(i=>`<label class="fld">Producto ${i}<select id="cb_s${i}">${i===3?'<option value="0">— ninguno —</option>':''}${opts(i)}</select></label><label class="fld">Cantidad<input type="number" id="cb_q${i}" value="1"></label>`).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="comboSave()">Crear combo</button></div>`)}
function comboSave(){const comps=[1,2,3].map(i=>({pid:+$('#cb_s'+i).value,q:+$('#cb_q'+i).value||1})).filter(c=>c.pid);S.products.push({id:S.seq++,kind:'combo',code:'7790009'+pad(S.seq,6),name:$('#cb_n').value||'Combo',cat:'Combos',emoji:'🎁',price:+$('#cb_p').value||0,comps,stock:{centro:0,deposito:0},min:0});save();closeModal();toast('Combo creado: ya está disponible en el POS','ok')}

/* ---------- 3. VENTAS Y DISTRIBUCIÓN ---------- */
function pgSales(){
  const t=tab('sales','orders');
  return tabs('sales',[['orders','Pedidos'],['customers','Clientes'],['vendors','Vendedores']],'orders')+(t==='orders'?salesOrders():t==='customers'?salesCust():salesVend());
}
function salesOrders(){
  const f=ui.salesFilter;
  const l=S.sales.filter(x=>x.channel!=='salon'&&(f==='Todos'||x.status===f||(f==='Web'&&x.channel==='web'))&&x.sync!=='pending').slice(-40).reverse();
  return `<div class="card"><div class="row sb" style="margin-bottom:12px"><div class="cats" style="margin:0">${['Todos','Pendiente','Preparado','Entregado','Web'].map(c=>`<button class="${f===c?'on':''}" onclick="ui.salesFilter='${c}';render()">${c==='Web'?'Pedidos web':c}</button>`).join('')}</div><button class="btn p" onclick="orderModal()">${ic('plus')} Nuevo pedido de oficina</button></div>
  ${table(['N°','Fecha','Origen','Cliente','Vendedor','>Ítems','>Total','Estado',''],l.map(x=>`<tr><td>#${x.n}</td><td>${fdt(x.ts)}</td><td><span class="chip ${x.channel==='web'?'ok':'brand'}">${CHN[x.channel]}</span></td><td>${esc(CU(x.customerId).name)}</td><td>${esc(x.vendor)}</td><td class="r">${x.items.length}</td><td class="r"><b>${money(x.total)}</b></td><td>${stChip(x.status)}</td><td class="r">${x.status==='Pendiente'?`<button class="btn sm" onclick="orderAdv('${x.id}')">Preparar →</button>`:x.status==='Preparado'?`<button class="btn sm ok" onclick="orderAdv('${x.id}')">Entregar ✓</button>`:''}</td></tr>`).join(''))}</div>`;
}
function orderAdv(id){if(!guard())return;const x=S.sales.find(s=>s.id===id);x.status=x.status==='Pendiente'?'Preparado':'Entregado';save();render();toast(`Pedido #${x.n}: ${x.status}`,'ok')}
function orderModal(){
  if(!guard())return;
  ui.ord={cust:S.customers.find(c=>c.list==='dist').id,vendor:null,pay:'cc',lines:[{pid:1,fmt:'d',qty:2}]};ordRender();
}
function ordRender(){
  const o=ui.ord,c=CU(o.cust),vend=o.vendor||c.vendor,calc=o.lines.map(l=>LC(l,c.list)),total=sum(calc,'total');
  const opts=sel=>S.products.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
  modal(`<h2>Nuevo pedido de oficina <button class="x" onclick="closeModal()">×</button></h2><div class="form">
   <label class="fld">Cliente<select onchange="ui.ord.cust=+this.value;ui.ord.vendor=null;ordRender()">${S.customers.filter(x=>x.list==='dist').map(x=>`<option value="${x.id}" ${o.cust===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
   <label class="fld">Vendedor<select onchange="ui.ord.vendor=this.value;ordRender()">${S.vendors.map(v=>`<option ${vend===v.name?'selected':''}>${v.name}</option>`).join('')}</select></label>
   <label class="fld">Lista de precios<input type="text" disabled value="${S.lists[c.list].name}"></label>
   <label class="fld">Condición de pago<select onchange="ui.ord.pay=this.value"><option value="cc" ${o.pay==='cc'?'selected':''}>Cuenta corriente</option><option value="qr" ${o.pay==='qr'?'selected':''}>Contado / Transferencia</option></select></label></div>
   <table style="margin-top:14px"><thead><tr><th>Producto</th><th>Formato</th><th>Cant.</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>${o.lines.map((l,i)=>`<tr><td><select onchange="ui.ord.lines[${i}].pid=+this.value;ordRender()">${opts(l.pid)}</select></td><td><select ${P(l.pid).kind==='combo'?'disabled':''} onchange="ui.ord.lines[${i}].fmt=this.value;ordRender()"><option value="u" ${l.fmt==='u'?'selected':''}>Unidad</option><option value="d" ${l.fmt==='d'?'selected':''}>Display x${P(l.pid).disp||1}</option><option value="b" ${l.fmt==='b'?'selected':''}>Bulto x${P(l.pid).bulto||1}</option></select></td><td><input type="number" min="1" style="width:70px" value="${l.qty}" onchange="ui.ord.lines[${i}].qty=Math.max(1,+this.value||1);ordRender()"></td><td class="r"><b>${money(calc[i].total)}</b></td><td><button class="rm" onclick="ui.ord.lines.splice(${i},1);ordRender()">✕</button></td></tr>`).join('')}</tbody></table>
   <button class="btn sm" style="margin-top:8px" onclick="ui.ord.lines.push({pid:2,fmt:'d',qty:1});ordRender()">${ic('plus')} Agregar producto</button>
   <div class="row sb" style="margin-top:14px;font-size:20px"><span>Total</span><b>${money(total)}</b></div>
   <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" ${o.lines.length?'':'disabled'} onclick="orderSave()">Confirmar pedido</button></div>`,true);
}
function orderSave(){
  const o=ui.ord,c=CU(o.cust),vend=o.vendor||c.vendor;
  const m=consume(o.lines.map(l=>({pid:l.pid,units:LC(l,c.list).units})));
  for(const pid in m){if(m[pid]>P(+pid).stock.deposito){toast('Stock insuficiente en depósito: '+P(+pid).name,'warn');return}}
  const sale=mkSale(S,{ts:Date.now(),channel:'oficina',vendor:vend,customerId:c.id,pay:o.pay,status:'Pendiente',lines:o.lines,list:c.list});sale.n=S.nextTicket++;
  S.sales.push(sale);applyStock(sale,'deposito');if(sale.pay==='cc')addCC('cliente',c.id,sale.total,0,'Pedido #'+sale.n);
  addLog(`Pedido #${sale.n} cargado por oficina (${c.name}, ${money(sale.total)})`,'info');save();closeModal();toast(`Pedido #${sale.n} creado · stock de depósito descontado`,'ok');
}
function salesCust(){
  const ss=srvSales();
  return `<div class="card"><div class="row sb" style="margin-bottom:12px"><span class="mut">${S.customers.filter(c=>c.id).length} clientes registrados</span><button class="btn p" onclick="custModal()">${ic('plus')} Nuevo cliente</button></div>${table(['Cliente','Tipo','Lista de precios','Vendedor','>Compras (30 d)','>Saldo cta. cte.','>Límite'],S.customers.filter(c=>c.id).map(c=>{const b=c.list==='dist'?ccBal('cliente',c.id):0,v=sum(ss.filter(x=>x.customerId===c.id&&x.ts>=startOfDay(Date.now())-29*DAY),'total');return `<tr><td><b>${esc(c.name)}</b></td><td>${c.type}</td><td>${S.lists[c.list].name}</td><td>${esc(c.vendor)}</td><td class="r">${money(v)}</td><td class="r ${b>c.limit*.8&&c.limit?'neg':''}">${c.list==='dist'?money(b):'—'}</td><td class="r mut">${c.limit?money(c.limit):'—'}</td></tr>`}).join(''))}</div>`;
}
function custModal(){if(!guard())return;modal(`<h2>Nuevo cliente <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld full">Razón social / nombre<input type="text" id="c_n"></label><label class="fld">Tipo<select id="c_t"><option>Almacén</option><option>Kiosco</option><option>Supermercado</option><option>Restaurante</option></select></label><label class="fld">Vendedor<select id="c_v">${S.vendors.map(v=>`<option>${v.name}</option>`).join('')}</select></label><label class="fld">Límite de crédito<input type="number" id="c_l" value="200000"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="custSave()">Guardar</button></div>`)}
function custSave(){const n=$('#c_n').value.trim();if(!n){toast('Ingresá un nombre','warn');return}S.customers.push({id:S.seq++,name:n,type:$('#c_t').value,list:'dist',vendor:$('#c_v').value,limit:+$('#c_l').value||0});save();closeModal();toast('Cliente creado','ok')}
function salesVend(){
  const ss=srvSales().filter(x=>x.ts>=startOfDay(Date.now())-29*DAY),mx=Math.max(1,...S.vendors.map(v=>sum(ss.filter(x=>x.vendor===v.name),'total')));
  return `<div class="grid g3">${S.vendors.map(v=>{const l=ss.filter(x=>x.vendor===v.name),t=sum(l,'total');return `<div class="card"><h3>👤 ${v.name}</h3><div class="mut">${v.zone}</div><div style="font-size:26px;font-weight:800;margin:8px 0">${money(t)}</div>${hb('Pedidos',l.length,Math.max(...S.vendors.map(z=>ss.filter(x=>x.vendor===z.name).length)),l.length)}${hb('Clientes',new Set(l.map(x=>x.customerId)).size,8,new Set(l.map(x=>x.customerId)).size,'#0ea5e9')}<div class="row sb mt"><span class="mut">Comisión 2%</span><b class="pos">${money(t*.02)}</b></div></div>`}).join('')}</div>
  <div class="card mt"><h3>Ventas por vendedor y canal (30 días)</h3>${[...S.vendors.map(v=>v.name),'Web','Salón'].map(n=>{const t=sum(ss.filter(x=>x.vendor===n),'total');return hb(n,t,Math.max(mx,sum(ss.filter(x=>x.vendor==='Salón'),'total')),money(t),n==='Web'?'#10b981':n==='Salón'?'#a855f7':'#6366f1')}).join('')}</div>`;
}

   <div class="shopbody"><div><div class="pgrid">${S.products.filter(p=>p.kind==='prod').map(p=>{const a=p.stock.deposito,u=LC({pid:p.id,fmt:'u',qty:1},'ecom');return `<button class="pcard ${a<=0?'out':''}" onclick="webAdd(${p.id})"><span class="pemo">${p.emoji}</span><b>${esc(p.name)}</b><span class="pprice">${money(u.total)}</span><span class="pstock">${a>0?'Disponible · '+a+' u.':'Sin stock'}</span></button>`}).join('')}</div></div>
