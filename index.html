    <div class="row sb" style="margin:12px 0;font-size:20px"><span>Total</span><b>${money(tot)}</b></div><label class="fld">Tu nombre<input type="text" id="web_name" value="${esc(ui.custName)}" placeholder="Nombre y apellido" oninput="ui.custName=this.value"></label><button class="btn p lg" style="width:100%;justify-content:center;margin-top:10px" ${wc.length?'':'disabled'} onclick="webCheckout()">Finalizar compra</button></div></div></div></div>
  <div class="grid g2 mt"><div class="card"><h3>Últimos pedidos web recibidos</h3>${table(['N°','Fecha','Cliente','>Total','Estado'],web.map(x=>`<tr><td>#${x.n}</td><td>${fdt(x.ts)}</td><td>${esc(CU(x.customerId).name)}</td><td class="r">${money(x.total)}</td><td>${stChip(x.status)}</td></tr>`).join(''))}<p class="mut" style="margin:10px 0 0">Cada compra web baja el stock del depósito y entra a la misma cola de pedidos de la oficina.</p></div>
   <div class="card"><h3>Listas de precios diferenciadas</h3>${table(['Producto','>Distribución','>Ecommerce','>Salón'],S.products.filter(p=>p.kind==='prod').slice(0,5).map(p=>`<tr><td>${p.emoji} ${esc(p.name)}</td><td class="r">${money(round10(p.price*S.lists.dist.factor))}</td><td class="r"><b>${money(round10(p.price*S.lists.ecom.factor))}</b></td><td class="r">${money(p.price)}</td></tr>`).join(''))}<div class="tag-off okk" style="margin:12px 0 0">☁ La tienda vive en la nube: sigue recibiendo pedidos aunque el local se quede sin internet.</div></div></div>`;
}
function webAdd(pid){const p=P(pid);let l=ui.webCart.find(x=>x.pid===pid);const n=(l?l.qty:0)+1;if(n>p.stock.deposito){toast('Sin stock disponible','warn');return}if(l)l.qty=n;else ui.webCart.push({pid,fmt:'u',qty:1});beep(true);render()}
function webQty(i,d){const l=ui.webCart[i];l.qty+=d;if(l.qty<=0)ui.webCart.splice(i,1);else if(l.qty>P(l.pid).stock.deposito)l.qty-=d;render()}
function webCheckout(){
  const name=($('#web_name').value||'').trim()||'Cliente web';
  let c=S.customers.find(x=>x.list==='ecom'&&x.name===name);if(!c){c={id:S.seq++,name,type:'Web',list:'ecom',vendor:'Web',limit:0};S.customers.push(c)}
  const sale=mkSale(S,{ts:Date.now(),channel:'web',vendor:'Web',customerId:c.id,pay:'qr',status:'Pendiente',lines:ui.webCart,list:'ecom'});sale.n=S.nextTicket++;
  S.sales.push(sale);applyStock(sale,'deposito');addLog(`Pedido web #${sale.n} recibido (${name}, ${money(sale.total)})`,'ok');
  ui.webCart=[];ui.custName='';save();render();toast(`✓ Pedido web #${sale.n} recibido. Ya aparece en Ventas → Pedidos.`,'ok');
}

/* ---------- 5. CAJAS Y TESORERÍA ---------- */
function cashExpected(c){return c.opening+sum(c.movs.filter(m=>m.type==='venta'&&m.method==='efectivo'),'amount')+sum(c.movs.filter(m=>m.type==='ingreso'),'amount')-sum(c.movs.filter(m=>m.type==='egreso'),'amount')}
const tesBal=()=>sum(S.tes,'amount');
function pgCaja(){
  const c=S.caja,t=tab('caja','caja');
  return tabs('caja',[['caja','Caja del salón'],['tes','Tesorería'],['hist','Cierres anteriores']],'caja')+(t==='caja'?cajaView():t==='tes'?tesView():cierresView());
}
function cajaView(){
  const c=S.caja;
  if(!c.open)return `<div class="card" style="max-width:520px;margin:20px auto;text-align:center"><div style="font-size:44px">🔒</div><h3 style="justify-content:center">Caja cerrada</h3><p class="mut">Último cierre: ${S.cierres.length?fdt(S.cierres[S.cierres.length-1].ts):'—'}</p><button class="btn p lg" onclick="openCajaModal()">Abrir caja</button></div>`;
  const by=m=>sum(c.movs.filter(x=>x.type==='venta'&&x.method===m),'amount');
  const mv=c.movs.slice().sort((a,b)=>b.ts-a.ts).slice(0,14);
  return `<div class="grid g4">${kpi('Caja #'+c.id,'Abierta','Desde '+ftime(c.openedAt)+' · '+esc(c.cashier),'ok')}${kpi('Efectivo esperado',money(cashExpected(c)),'Apertura '+money(c.opening))}${kpi('Ventas del turno',money(by('efectivo')+by('tarjeta')+by('qr')+by('cc')),c.movs.filter(x=>x.type==='venta').length+' tickets')}${kpi('Tesorería',money(tesBal()),'Saldo disponible')}</div>
  <div class="grid g21 mt"><div class="card"><h3>Movimientos del turno <span class="sp row"><button class="btn sm" onclick="movModal('ingreso')">+ Ingreso</button><button class="btn sm" onclick="movModal('egreso')">− Egreso</button><button class="btn sm p" onclick="arqueoModal()">Arqueo y cierre</button></span></h3>${table(['Hora','Tipo','Concepto','Medio','>Monto'],mv.map(m=>`<tr><td>${ftime(m.ts)}</td><td><span class="chip ${m.type==='venta'?'brand':m.type==='ingreso'?'ok':'bad'}">${m.type}</span></td><td>${esc(m.concept)}</td><td>${PAYN[m.method]}</td><td class="r ${m.type==='egreso'?'neg':''}"><b>${m.type==='egreso'?'-':''}${money(m.amount)}</b></td></tr>`).join(''))}</div>
  <div class="card"><h3>Ventas por medio de pago</h3>${[['efectivo','#10b981'],['tarjeta','#6366f1'],['qr','#0ea5e9'],['cc','#f59e0b']].map(([m,col])=>hb(PAYN[m],by(m),Math.max(1,by('efectivo'),by('tarjeta'),by('qr'),by('cc')),money(by(m)),col)).join('')}${S.outbox.length?`<p class="mut">Incluye ${S.outbox.length} venta(s) offline aún no sincronizadas: la caja siempre refleja lo vendido en el equipo.</p>`:''}</div></div>`;
}
function openCajaModal(){modal(`<h2>Apertura de caja <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld">Cajero<select id="oc_c"><option>María Gómez</option><option>Lucas Pereyra</option></select></label><label class="fld">Efectivo inicial<input type="number" id="oc_a" value="20000"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="openCaja()">Abrir caja</button></div>`)}
function openCaja(){S.cajaSeq++;S.caja={open:true,id:S.cajaSeq,openedAt:Date.now(),opening:+$('#oc_a').value||0,cashier:$('#oc_c').value,movs:[]};addLog('Caja #'+S.cajaSeq+' abierta','info');save();closeModal();toast('Caja abierta','ok')}
function movModal(type){modal(`<h2>${type==='ingreso'?'Ingreso':'Egreso'} de efectivo <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld full">Concepto<input type="text" id="mv_c" value="${type==='ingreso'?'Ingreso por cambio':'Pago a proveedor / retiro'}"></label><label class="fld">Monto<input type="number" id="mv_a" value="5000"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="movSave('${type}')">Registrar</button></div>`)}
function movSave(type){const a=+$('#mv_a').value||0;if(a<=0)return;S.caja.movs.push({ts:Date.now(),type,method:'efectivo',amount:a,concept:$('#mv_c').value||type});save();closeModal();toast('Movimiento registrado','ok')}
const DEN=[20000,10000,2000,1000,500,200,100,50];
function arqueoModal(){
  const c=S.caja;
  modal(`<h2>Arqueo y cierre de caja <button class="x" onclick="closeModal()">×</button></h2><p class="mut">Contá los billetes y monedas. El sistema compara contra el efectivo esperado.</p>
   <div class="denom">${DEN.map(d=>`<label>$${num(d)}<input type="number" min="0" id="dn_${d}" value="0" oninput="arqueoCalc()"></label>`).join('')}</div>
   <div class="card mt" style="background:#f8fafc;box-shadow:none"><div class="row sb"><span>Efectivo esperado</span><b>${money(cashExpected(c))}</b></div><div class="row sb"><span>Efectivo contado</span><b id="aq_cnt">$0</b></div><div class="row sb" style="font-size:18px"><span>Diferencia</span><b id="aq_diff">—</b></div></div>
   <label class="row" style="margin-top:12px"><input type="checkbox" id="aq_rend" ${S.online?'checked':'disabled'}> Rendir el efectivo a tesorería al cerrar ${S.online?'':'<span class="chip warn">requiere conexión: se rinde luego</span>'}</label>
   <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn bad" onclick="cerrarCaja()">Cerrar caja</button></div>`);
  arqueoCalc();
}
const counted=()=>sum(DEN,d=>d*(+($('#dn_'+d)||{}).value||0));
function arqueoCalc(){const cnt=counted(),d=cnt-cashExpected(S.caja);$('#aq_cnt').textContent=money(cnt);const e=$('#aq_diff');e.textContent=(d>0?'+':'')+money(d);e.className=d===0?'pos':d>0?'':'neg'}
function cerrarCaja(){
  const c=S.caja,cnt=counted(),exp=cashExpected(c),rend=$('#aq_rend').checked&&S.online;
  const by=m=>sum(c.movs.filter(x=>x.type==='venta'&&x.method===m),'amount');
  const cierre={id:c.id,ts:Date.now(),openedAt:c.openedAt,cashier:c.cashier,opening:c.opening,expected:exp,counted:cnt,diff:cnt-exp,rendido:rend,totals:{efectivo:by('efectivo'),tarjeta:by('tarjeta'),qr:by('qr'),cc:by('cc')}};
  S.cierres.push(cierre);if(rend)addTes('Rendición caja #'+c.id,cnt);
  c.open=false;ui.cart=[];addLog(`Caja #${c.id} cerrada. Diferencia ${money(cnt-exp)}`,'info');save();closeModal();toast('Caja cerrada'+(rend?' y rendida a tesorería':''),'ok');
}
function rendir(id){if(!guard())return;const c=S.cierres.find(x=>x.id===id);c.rendido=true;addTes('Rendición caja #'+id,c.counted);save();render();toast('Rendición registrada en tesorería','ok')}
function tesView(){
  let run=0;const rows=S.tes.map(m=>{run+=m.amount;return{...m,run}}).reverse().slice(0,18);
  return `<div class="grid g3">${kpi('Saldo de tesorería',money(tesBal()),'Efectivo y bancos')}${kpi('Rendiciones (30 d)',money(sum(S.tes.filter(m=>m.concept.startsWith('Rendición')),'amount')),S.tes.filter(m=>m.concept.startsWith('Rendición')).length+' cajas rendidas','ok')}${kpi('Egresos (30 d)',money(-sum(S.tes.filter(m=>m.amount<0),'amount')),'Pagos y depósitos','warn')}</div>
  <div class="card mt"><h3>Movimientos de tesorería <button class="btn sm p sp" onclick="tesModal()">+ Registrar movimiento</button></h3>${table(['Fecha','Concepto','>Importe','>Saldo'],rows.map(m=>`<tr><td>${fdt(m.ts)}</td><td>${esc(m.concept)}</td><td class="r ${m.amount<0?'neg':'pos'}"><b>${m.amount<0?'-':'+'}${money(Math.abs(m.amount))}</b></td><td class="r">${money(m.run)}</td></tr>`).join(''))}</div>`;
}
function tesModal(){if(!guard())return;modal(`<h2>Movimiento de tesorería <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld">Tipo<select id="te_t"><option value="1">Ingreso</option><option value="-1">Egreso</option></select></label><label class="fld">Importe<input type="number" id="te_a" value="50000"></label><label class="fld full">Concepto<input type="text" id="te_c" value="Depósito bancario"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="tesSave()">Registrar</button></div>`)}
function tesSave(){const a=(+$('#te_a').value||0)*(+$('#te_t').value);if(!a)return;addTes($('#te_c').value||'Movimiento',a);save();closeModal();toast('Movimiento registrado','ok')}
function cierresView(){
  return `<div class="card"><h3>Historial de cierres y arqueos</h3>${table(['Caja','Cajero','Apertura','Cierre','>Esperado','>Contado','>Diferencia','Rendición'],S.cierres.slice().reverse().map(x=>`<tr><td>#${x.id}</td><td>${esc(x.cashier)}</td><td>${fdt(x.openedAt)}</td><td>${fdt(x.ts)}</td><td class="r">${money(x.expected)}</td><td class="r">${money(x.counted)}</td><td class="r ${x.diff<0?'neg':x.diff>0?'':'pos'}"><b>${x.diff>0?'+':''}${money(x.diff)}</b></td><td>${x.rendido?'<span class="chip ok">Rendida</span>':`<button class="btn sm p" onclick="rendir(${x.id})">Rendir ahora</button>`}</td></tr>`).join(''))}</div>`;
}

/* ---------- 6. ADMINISTRACIÓN ---------- */
function pgAdmin(){const t=tab('admin','cc');return tabs('admin',[['cc','Cuentas corrientes'],['gastos','Gastos'],['pay','Sueldos y adelantos']],'cc')+(t==='cc'?adminCC():t==='gastos'?adminGastos():adminPay())}
function adminCC(){
  const k=ui.ccKind,list=k==='cliente'?S.customers.filter(c=>c.list==='dist'):S.providers;
  const totC=sum(S.customers.filter(c=>c.list==='dist'),c=>ccBal('cliente',c.id)),totP=sum(S.providers,p=>ccBal('proveedor',p.id));
  return `<div class="grid g3" style="margin-bottom:16px">${kpi('A cobrar (clientes)',money(totC),'Saldo deudor total','warn')}${kpi('A pagar (proveedores)',money(totP),'Saldo acreedor total','')}${kpi('Posición neta',money(totC-totP),'Cobrar − pagar',totC-totP>=0?'ok':'bad')}</div>
  <div class="card"><div class="row sb" style="margin-bottom:12px"><div class="cats" style="margin:0"><button class="${k==='cliente'?'on':''}" onclick="ui.ccKind='cliente';ui.ccSearch='';render()">Clientes</button><button class="${k==='proveedor'?'on':''}" onclick="ui.ccKind='proveedor';ui.ccSearch='';render()">Proveedores</button></div></div>
  <input type="text" class="in" style="width:100%;max-width:420px;margin-bottom:12px;font-size:16px;padding:11px 14px" placeholder="🔍 Buscar ${k==='cliente'?'cliente':'proveedor'} por nombre…" value="${esc(ui.ccSearch)}" oninput="ui.ccSearch=this.value;$('#ccRows').innerHTML=ccRows()">
  ${table(['Nombre',k==='cliente'?'Vendedor':'','>Saldo',k==='cliente'?'Uso del límite':'','Último movimiento',''],`<tbody id="ccRows" style="display:contents">${ccRows()}</tbody>`)}</div>`;
}
function ccRows(){
  const k=ui.ccKind,q=ui.ccSearch.trim().toLowerCase(),list=(k==='cliente'?S.customers.filter(c=>c.list==='dist'):S.providers).filter(e=>!q||e.name.toLowerCase().includes(q));
  return list.map(e=>{const b=ccBal(k,e.id),lm=ui.ccKind==='cliente'?e.limit:0,last=S.cc.filter(x=>x.kind===k&&x.eid===e.id).slice(-1)[0];return `<tr><td><b>${esc(e.name)}</b></td><td>${k==='cliente'?esc(e.vendor):''}</td><td class="r ${b>0?(k==='cliente'?'neg':''):'pos'}"><b>${money(b)}</b></td><td style="width:160px">${lm?`<span class="hbt" style="display:block"><i style="display:block;height:100%;width:${Math.min(100,b/lm*100)}%;background:${b/lm>.8?'#dc2626':'#6366f1'}"></i></span>`:''}</td><td class="mut">${last?fdate(last.ts)+' · '+esc(last.concept):'—'}</td><td class="r"><button class="btn sm" onclick="ledgerModal('${k}',${e.id})">Movimientos</button> <button class="btn sm p" onclick="ccPayModal('${k}',${e.id})">${k==='cliente'?'Registrar cobro':'Registrar pago'}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Sin resultados</td></tr>';
}
function ledgerModal(k,id){
  const e=k==='cliente'?CU(id):S.providers.find(p=>p.id===id);let run=0;
  const rows=S.cc.filter(x=>x.kind===k&&x.eid===id).map(x=>{run+=x.charge-x.pay;return `<tr><td>${fdate(x.ts)}</td><td>${esc(x.concept)}</td><td class="r">${x.charge?money(x.charge):''}</td><td class="r pos">${x.pay?money(x.pay):''}</td><td class="r"><b>${money(run)}</b></td></tr>`});
  modal(`<h2>Cuenta corriente · ${esc(e.name)} <button class="x" onclick="closeModal()">×</button></h2>${table(['Fecha','Concepto','>Cargo','>Pago','>Saldo'],rows.join(''))}<div class="actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`,true);
}
function ccPayModal(k,id){if(!guard())return;const e=k==='cliente'?CU(id):S.providers.find(p=>p.id===id);modal(`<h2>${k==='cliente'?'Registrar cobro':'Registrar pago'} · ${esc(e.name)} <button class="x" onclick="closeModal()">×</button></h2><p class="mut">Saldo actual: <b>${money(ccBal(k,id))}</b></p><div class="form"><label class="fld">Importe<input type="number" id="cp_a" value="${Math.max(0,ccBal(k,id))}"></label><label class="fld">Medio<select id="cp_m"><option>Efectivo</option><option>Transferencia</option><option>Cheque</option></select></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="ccPaySave('${k}',${id})">Confirmar</button></div>`)}
function ccPaySave(k,id){const a=+$('#cp_a').value||0;if(a<=0)return;const e=k==='cliente'?CU(id):S.providers.find(p=>p.id===id);addCC(k,id,0,a,k==='cliente'?'Cobranza ('+$('#cp_m').value+')':'Pago ('+$('#cp_m').value+')');addTes((k==='cliente'?'Cobranza ':'Pago a ')+e.name,k==='cliente'?a:-a);save();closeModal();toast(k==='cliente'?'Cobro registrado y enviado a tesorería':'Pago registrado y descontado de tesorería','ok')}
function adminGastos(){
  const m=monthKey(Date.now()),l=S.gastos.filter(g=>monthKey(g.ts)===m),by={};S.gastos.forEach(g=>by[g.cat]=(by[g.cat]||0)+g.amount);const mx=Math.max(1,...Object.values(by));
  return `<div class="grid g21"><div class="card"><h3>Registrar gasto</h3><div class="row"><label class="fld">Categoría<select id="g_c">${['Alquiler','Servicios','Combustible','Mantenimiento','Publicidad','Impuestos','Otros'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="fld" style="flex:1">Descripción<input type="text" id="g_d" placeholder="Ej: Reparación de balanza"></label><label class="fld">Importe<input type="number" id="g_a" style="width:120px"></label><label class="fld">Medio<select id="g_m"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option></select></label><button class="btn p" style="align-self:flex-end" onclick="gastoSave()">Agregar</button></div>
   <div style="margin-top:16px">${table(['Fecha','Categoría','Descripción','Medio','>Importe'],S.gastos.slice().reverse().slice(0,12).map(g=>`<tr><td>${fdate(g.ts)}</td><td><span class="chip">${g.cat}</span></td><td>${esc(g.desc)}</td><td>${g.method}</td><td class="r"><b>${money(g.amount)}</b></td></tr>`).join(''))}</div></div>
  <div class="card"><h3>Gastos por categoría</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>hb(c,v,mx,money(v),'#f59e0b')).join('')}<div class="row sb mt"><span>Total del mes</span><b>${money(sum(l,'amount'))}</b></div></div></div>`;
}
function gastoSave(){if(!guard())return;const a=+$('#g_a').value||0,d=$('#g_d').value.trim();if(!a||!d){toast('Completá descripción e importe','warn');return}const m=$('#g_m').value;S.gastos.push({id:S.seq++,ts:Date.now(),cat:$('#g_c').value,desc:d,amount:a,method:m});if(m==='efectivo')addTes('Gasto: '+d,-a);save();render();toast('Gasto registrado'+(m==='efectivo'?' y descontado de tesorería':''),'ok')}
function adminPay(){
  const m=monthKey(Date.now());
  const rows=S.employees.map(e=>{const adel=sum(S.payroll.filter(p=>p.eid===e.id&&p.kind==='adelanto'&&p.month===m),'amount'),paid=S.payroll.some(p=>p.eid===e.id&&p.kind==='sueldo'&&p.month===m);return `<tr><td><b>${esc(e.name)}</b></td><td>${e.role}</td><td class="r">${money(e.salary)}</td><td class="r neg">${adel?'-'+money(adel):'—'}</td><td class="r"><b>${money(e.salary-adel)}</b></td><td>${paid?'<span class="chip ok">Liquidado</span>':'<span class="chip warn">Pendiente</span>'}</td><td class="r"><button class="btn sm" ${paid?'disabled':''} onclick="adelModal(${e.id})">Adelanto</button> <button class="btn sm p" ${paid?'disabled':''} onclick="liquidar(${e.id})">Liquidar sueldo</button></td></tr>`}).join('');
  return `<div class="grid g3" style="margin-bottom:16px">${kpi('Masa salarial',money(sum(S.employees,'salary')),S.employees.length+' empleados')}${kpi('Adelantos del mes',money(sum(S.payroll.filter(p=>p.kind==='adelanto'&&p.month===m),'amount')),'A descontar en la liquidación','warn')}${kpi('Liquidado',money(sum(S.payroll.filter(p=>p.kind==='sueldo'&&p.month===m),'amount')),'Sueldos pagados este mes','ok')}</div><div class="card">${table(['Empleado','Puesto','>Sueldo base','>Adelantos','>Neto a pagar','Estado',''],rows)}</div>`;
}
function adelModal(id){if(!guard())return;modal(`<h2>Registrar adelanto · ${esc(S.employees.find(e=>e.id===id).name)} <button class="x" onclick="closeModal()">×</button></h2><div class="form"><label class="fld">Importe<input type="number" id="ad_a" value="50000"></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="adelSave(${id})">Registrar</button></div>`)}
function adelSave(id){const a=+$('#ad_a').value||0;if(a<=0)return;S.payroll.push({ts:Date.now(),eid:id,kind:'adelanto',amount:a,month:monthKey(Date.now())});addTes('Adelanto de sueldo: '+S.employees.find(e=>e.id===id).name,-a);save();closeModal();toast('Adelanto registrado','ok')}
function liquidar(id){if(!guard())return;const e=S.employees.find(x=>x.id===id),m=monthKey(Date.now()),adel=sum(S.payroll.filter(p=>p.eid===id&&p.kind==='adelanto'&&p.month===m),'amount'),net=e.salary-adel;S.payroll.push({ts:Date.now(),eid:id,kind:'sueldo',amount:net,month:m});addTes('Sueldo: '+e.name,-net);save();render();toast(`Sueldo liquidado: ${money(net)}`,'ok')}

/* ---------- 7. REPORTES ---------- */
function pgReports(){
  const t=tab('reports','ventas'),n=ui.repRange,t0=startOfDay(Date.now()),from=t0-(n-1)*DAY;
  const ss=srvSales().filter(x=>x.ts>=from),R=repBuild(t,ss,from,n);ui.rep=R;
  return `<div class="row sb"><div>${tabs('reports',[['ventas','Ventas'],['rentab','Rentabilidad'],['stock','Stock'],['imp','Impuestos y cajas']],'ventas')}</div><div class="row" style="margin-bottom:16px"><div class="cats" style="margin:0">${[[1,'Hoy'],[7,'7 días'],[30,'30 días']].map(([v,l])=>`<button class="${n===v?'on':''}" onclick="ui.repRange=${v};render()">${l}</button>`).join('')}</div><button class="btn ok" onclick="repExport()">${ic('dl')} Exportar a Excel</button></div></div>${R.html}`;
}
function repExport(){const R=ui.rep;exportCSV(R.name+'_'+new Date().toISOString().slice(0,10),R.heads,R.rows)}
function repBuild(t,ss,from,n){
  const t0=startOfDay(Date.now());
  if(t==='ventas'){
    const days=[];for(let i=0;i<n;i++){const a=from+i*DAY,l=ss.filter(x=>x.ts>=a&&x.ts<a+DAY);days.push({a,l,tot:sum(l,'total'),cost:sum(l,'cost')})}
    const tot=sum(ss,'total'),by=(f)=>{const o={};ss.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+x.total});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
    const tp={};ss.forEach(x=>x.items.forEach(i=>{tp[i.pid]=(tp[i.pid]||0)+i.total}));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const mxc=(a)=>a.length?a[0][1]:1,ch=by(x=>CHN[x.channel]),pm=by(x=>PAYN[x.pay]),vd=by(x=>x.vendor);
    const rows=days.map(d=>[fdate(d.a),d.l.length,Math.round(d.tot),Math.round(d.cost),Math.round(d.tot-d.cost)]);
    return{name:'reporte_ventas',heads:['Fecha','Tickets','Ventas','Costo','Margen'],rows,html:`<div class="grid g4">${kpi('Ventas del período',money(tot),ss.length+' operaciones')}${kpi('Ticket promedio',money(ss.length?tot/ss.length:0),'')}${kpi('Margen bruto',money(tot-sum(ss,'cost')),tot?Math.round((1-sum(ss,'cost')/tot)*100)+'% sobre ventas':'','ok')}${kpi('Ventas offline sincronizadas',ss.filter(x=>x.channel==='salon'&&x.offline).length||'—','Sin pérdida de datos')}</div>
     <div class="grid g21 mt"><div class="card"><h3>Ventas por día</h3>${bars(days.map(d=>d.tot),days.map(d=>fdate(d.a)))}</div><div class="card"><h3>Por canal</h3>${ch.map(([k,v])=>hb(k,v,mxc(ch),money(v),'#6366f1')).join('')}<h3 style="margin-top:14px">Por medio de pago</h3>${pm.map(([k,v])=>hb(k,v,mxc(pm),money(v),'#0ea5e9')).join('')}</div></div>
     <div class="grid g2 mt"><div class="card"><h3>Por vendedor</h3>${vd.map(([k,v])=>hb(k,v,mxc(vd),money(v),'#a855f7')).join('')}</div><div class="card"><h3>Productos más vendidos</h3>${top.map(([id,v])=>hb(esc(P(+id).name.slice(0,20)),v,top[0][1],money(v),'#10b981')).join('')}</div></div>
     <div class="card mt"><h3>Detalle diario</h3>${table(['Fecha','>Tickets','>Ventas','>Costo','>Margen'],rows.map(r=>`<tr><td>${r[0]}</td><td class="r">${r[1]}</td><td class="r"><b>${money(r[2])}</b></td><td class="r mut">${money(r[3])}</td><td class="r pos">${money(r[4])}</td></tr>`).join(''))}</div>`};
  }
  if(t==='rentab'){
    const o={};ss.forEach(x=>x.items.forEach(i=>{const p=P(i.pid),c=p?p.cat:'Otros';o[c]=o[c]||{v:0,c:0};o[c].v+=i.total;o[c].c+=i.cost}));
    const rows=Object.entries(o).sort((a,b)=>b[1].v-a[1].v).map(([c,d])=>[c,Math.round(d.v),Math.round(d.c),Math.round(d.v-d.c),Math.round((1-d.c/d.v)*100)+'%']);
    const tp={};ss.forEach(x=>x.items.forEach(i=>{tp[i.pid]=tp[i.pid]||{v:0,c:0};tp[i.pid].v+=i.total;tp[i.pid].c+=i.cost}));const top=Object.entries(tp).sort((a,b)=>(b[1].v-b[1].c)-(a[1].v-a[1].c)).slice(0,8);
    return{name:'reporte_rentabilidad',heads:['Categoría','Ventas','Costo','Margen $','Margen %'],rows,html:`<div class="grid g2"><div class="card"><h3>Rentabilidad por categoría</h3>${table(['Categoría','>Ventas','>Costo','>Margen','>%'],rows.map(r=>`<tr><td><b>${r[0]}</b></td><td class="r">${money(r[1])}</td><td class="r mut">${money(r[2])}</td><td class="r pos">${money(r[3])}</td><td class="r"><b>${r[4]}</b></td></tr>`).join(''))}</div><div class="card"><h3>Productos que más margen dejan</h3>${top.map(([id,d])=>hb(esc(P(+id).name.slice(0,20)),d.v-d.c,top[0][1].v-top[0][1].c,money(d.v-d.c),'#10b981')).join('')}</div></div>`};
  }
  if(t==='stock'){
    const ps=S.products.filter(p=>p.kind==='prod');
    const rows=ps.map(p=>[p.name,p.cat,p.stock.centro,p.stock.deposito,p.stock.centro+p.stock.deposito,p.cost,Math.round((p.stock.centro+p.stock.deposito)*p.cost),Math.round((p.stock.centro+p.stock.deposito)*p.price)]);
    const vc=sum(rows,r=>r[6]),vp=sum(rows,r=>r[7]);
    return{name:'reporte_stock',heads:['Producto','Categoría','Stock salón','Stock depósito','Total','Costo unit.','Valor a costo','Valor a precio'],rows,html:`<div class="grid g4">${kpi('Valor del stock (costo)',money(vc),'Inversión inmovilizada')}${kpi('Valor del stock (venta)',money(vp),'Potencial de venta')}${kpi('Margen potencial',money(vp-vc),Math.round((1-vc/vp)*100)+'%','ok')}${kpi('Bajo mínimo',ps.filter(p=>p.stock.centro<p.min).length,'Reponer desde depósito','bad')}</div><div class="card mt">${table(['Producto','Cat.','>Salón','>Depósito','>Total','>Valor costo','>Valor venta'],rows.map((r,i)=>`<tr><td>${ps[i].emoji} ${esc(r[0])}</td><td>${r[1]}</td><td class="r ${r[2]<ps[i].min?'neg':''}"><b>${r[2]}</b></td><td class="r">${r[3]}</td><td class="r">${r[4]}</td><td class="r">${money(r[6])}</td><td class="r">${money(r[7])}</td></tr>`).join(''))}</div>`};
  }
  // impuestos y cajas
  const net=sum(ss,'total'),cmv=sum(ss,'cost'),gast=sum(S.gastos.filter(g=>g.ts>=from),'amount'),deb=net/1.21*.21,cred=(cmv+gast)/1.21*.21,iibb=net/1.21*(S.iibb/100);
  const rows=[['Ventas totales (c/IVA)',Math.round(net)],['Ventas netas (s/IVA)',Math.round(net/1.21)],['IVA débito fiscal (21%)',Math.round(deb)],['IVA crédito fiscal (estimado)',Math.round(cred)],['Saldo IVA a pagar',Math.round(deb-cred)],['Ingresos Brutos ('+S.iibb+'%)',Math.round(iibb)]];
  const cj=S.cierres.filter(c=>c.ts>=from);
  return{name:'reporte_impuestos',heads:['Concepto','Importe'],rows,html:`<div class="grid g2"><div class="card"><h3>Posición impositiva estimada</h3>${table(['Concepto','>Importe'],rows.map(r=>`<tr><td>${r[0]}</td><td class="r ${r[0].startsWith('Saldo')?'':''}"><b>${money(r[1])}</b></td></tr>`).join(''))}<p class="mut" style="margin:10px 0 0">Calculado sobre las ventas sincronizadas del período. Se exporta para el estudio contable.</p></div>
   <div class="card"><h3>Control de cajas</h3>${cj.length?table(['Caja','Fecha','>Diferencia','Estado'],cj.slice().reverse().map(c=>`<tr><td>#${c.id}</td><td>${fdate(c.ts)}</td><td class="r ${c.diff<0?'neg':''}"><b>${c.diff>0?'+':''}${money(c.diff)}</b></td><td>${c.diff===0?'<span class="chip ok">Cuadra</span>':Math.abs(c.diff)<1000?'<span class="chip warn">Revisar</span>':'<span class="chip bad">Diferencia</span>'}</td></tr>`).join('')):'<div class="empty">No hubo cierres en el período</div>'}<div class="row sb mt"><span>Diferencia acumulada</span><b class="${sum(cj,'diff')<0?'neg':''}">${money(sum(cj,'diff'))}</b></div></div></div>`};
}

/* ---------- 8. SINCRONIZACIÓN ---------- */
function pgSync(){
  const q=pendingSales(),on=S.online;
  const flow=`<svg class="flow" viewBox="0 0 760 190" style="width:100%;height:auto"><g font-size="13" font-weight="700" text-anchor="middle">
   <rect x="10" y="50" width="190" height="90" rx="14" fill="#eef2ff" stroke="#6366f1"/><text x="105" y="82" fill="#3730a3">🖥 Terminal POS</text><text x="105" y="102" font-size="11" font-weight="500" fill="#64748b">Base de datos local</text><text x="105" y="120" font-size="11" font-weight="500" fill="#64748b">${q.length} venta(s) en cola</text>
   <rect x="285" y="50" width="190" height="90" rx="14" fill="${on?'#ecfdf5':'#fef2f2'}" stroke="${on?'#10b981':'#ef4444'}"/><text x="380" y="82" fill="${on?'#065f46':'#991b1b'}">${on?'📡 Conectado':'✖ Sin conexión'}</text><text x="380" y="102" font-size="11" font-weight="500" fill="#64748b">Cola de sincronización</text><text x="380" y="120" font-size="11" font-weight="500" fill="#64748b">${on?'Enviando en orden':'Guardando localmente'}</text>
   <rect x="560" y="10" width="190" height="170" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="655" y="42" fill="#0f172a">☁ Servidor central</text><text x="655" y="72" font-size="12" font-weight="500" fill="#64748b">Stock · Precios</text><text x="655" y="94" font-size="12" font-weight="500" fill="#64748b">Pedidos · Clientes</text><text x="655" y="116" font-size="12" font-weight="500" fill="#64748b">Tienda web · Oficina</text><text x="655" y="138" font-size="12" font-weight="500" fill="#64748b">Reportes · Contabilidad</text></g>
   <path d="M200 95 H285" fill="none" stroke-width="3" class="on"/><path d="M475 95 H560" fill="none" stroke-width="3" class="${on?'on':'off'}"/></svg>`;
  return `<div class="grid g3"><div class="card kpi ${on?'ok':'bad'}"><div class="l">Estado de la conexión</div><div class="v">${on?'En línea':'Sin conexión'}</div><div class="s">${on?'Sincronizando en segundo plano':'El POS opera con la base local'}</div></div>${kpi('Ventas pendientes',q.length,q.length?money(sum(q,'total'))+' sin enviar':'Todo sincronizado',q.length?'warn':'ok')}${kpi('Última sincronización',ftime(S.lastSync),'Catálogo, precios y stock')}</div>
  <div class="card mt"><h3>Cómo funciona</h3>${flow}</div>
  <div class="grid g2 mt"><div class="card"><h3>Cola de ventas pendientes <button class="btn sm p sp" ${on&&!ui.syncing&&q.length?'':'disabled'} onclick="syncNow()">${ic('sync')} Sincronizar ahora</button></h3>
   ${ui.syncing?`<div class="sync-bar" style="margin-bottom:12px"><i style="width:${ui.syncTotal?ui.syncIdx/ui.syncTotal*100:0}%"></i></div>`:''}
   ${q.length?table(['Ticket','Hora','>Ítems','>Total','Estado'],q.map(x=>`<tr><td>#${x.n}</td><td>${ftime(x.ts)}</td><td class="r">${x.items.length}</td><td class="r"><b>${money(x.total)}</b></td><td><span class="chip warn">⏳ Pendiente</span></td></tr>`).join('')):`<div class="empty"><b>✅</b>No hay ventas pendientes.<br><span class="mut">${on?'Cortá la conexión (switch superior) y vendé en el POS para ver cómo se encolan.':'Realizá ventas en el POS: aparecerán acá.'}</span></div>`}</div>
   <div class="card"><h3>Registro de actividad</h3><div style="max-height:320px;overflow:auto">${S.log.slice(0,14).map(l=>`<div class="row" style="padding:6px 0;border-bottom:1px solid #f1f4f8"><span class="mut" style="width:44px">${ftime(l.ts)}</span><span class="chip ${l.type==='ok'?'ok':l.type==='warn'?'warn':''}" style="flex:none">${l.type==='ok'?'OK':l.type==='warn'?'AVISO':'INFO'}</span><span>${esc(l.msg)}</span></div>`).join('')}</div></div></div>
  <div class="card mt"><h3>Garantías del modo offline</h3><div class="grid g3"><div><b>💾 Nada se pierde</b><p class="mut">Cada venta se guarda en el equipo en el momento. Si se apaga la PC o se recarga la página, la cola sigue ahí.</p></div><div><b>🔁 Sin duplicados</b><p class="mut">Cada venta lleva un identificador único: si la conexión se corta a mitad de la sincronización, se reanuda sin duplicar.</p></div><div><b>⚖️ Stock consistente</b><p class="mut">El POS descuenta stock local al vender; el servidor lo concilia al sincronizar y avisa si hay diferencias.</p></div></div></div>`;
}

/* ---------- guion de presentación ---------- */
function openGuide(){
  const st=[['Panel general','Mostrá la visión integrada: ventas, canales, stock crítico y los 6 módulos.',"closeModal();go('dash')",'Ir al panel'],
   ['Vender con internet','En el POS, escaneá productos (botón "Simular escaneo" o los códigos de prueba), cambiá el formato a display/bulto y cobrá.',"closeModal();go('pos')",'Ir al POS'],
   ['Cortar internet','Apagá el switch de conexión arriba a la derecha. El POS no se detiene: seguí vendiendo 2 o 3 tickets.',"closeModal();go('pos');setOnline(false)",'Cortar internet'],
   ['Ver la cola offline','Cada venta quedó guardada en el equipo. El panel central todavía no las ve (datos del servidor).',"closeModal();go('sync')",'Ver cola'],
   ['Reconectar','Volvé a prender el switch: las ventas se sincronizan solas, una a una, y el stock del servidor se actualiza.',"closeModal();go('sync');setOnline(true)",'Reconectar'],
   ['Resto de módulos','Productos y listas de precios · Pedidos de oficina · Tienda web · Cierre de caja · Cuentas corrientes · Reportes con exportación a Excel.',"closeModal();go('products')",'Ir a productos']];
  modal(`<h2>🎬 Guion sugerido de la demo <button class="x" onclick="closeModal()">×</button></h2>${st.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div style="flex:1"><b>${s[0]}</b><p>${s[1]}</p><button class="btn sm p" onclick="${s[2]}">${s[3]}</button></div></div>`).join('')}<p class="mut" style="margin:12px 0 0">Tip: "Reiniciar demo" (barra lateral) vuelve todo al estado inicial entre presentaciones.</p>`,true);
}

/* ---------- arranque ---------- */
S=load()||buildSeed();
if(!navigator.onLine&&S.online){S.online=false}
render();
if(S.online&&S.outbox.length)setTimeout(syncNow,1200);
</script>
